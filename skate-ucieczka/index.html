<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skate Ucieczka – uciekaj przed psem!</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d12;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 50px rgba(0,0,0,.7);border-radius:6px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
/* =========================================================
   SKATE UCIECZKA
   Chłopak w białej czapce Nike i czarnej bluzie ucieka na
   deskorolce przed psem. 10 żyć, przeszkody, butelki Pepsi,
   co 10 butelek: specjalny dźwięk + super skill (+1 życie).
   ========================================================= */

const W = 960, H = 540, GROUND = 455;
const GRAV = 2200, JUMP = 820, DJUMP = 720, TRICK_DUR = 0.42;
const FONT = '"Arial Black", "Segoe UI Black", Impact, sans-serif';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const r = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.floor(W * r), ch = Math.floor(H * r);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);
  scale = cv.width / W;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mixCol = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ======================= DŹWIĘK ======================= */
const Snd = {
  ctx: null, master: null, music: null, muted: false, nextT: 0, step: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.55;
    this.master.connect(this.ctx.destination);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    this.music = this.ctx.createGain(); this.music.gain.value = 0.32;
    this.music.connect(lp); lp.connect(this.master);
    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, len);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.55; },
  tone(f, d, type = 'square', v = 0.3, f2 = null, delay = 0, dest = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, v, ftype = 'highpass', freq = 1000, delay = 0, dest = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(dest || this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
  },
  jump()  { this.tone(300, 0.14, 'square', 0.12, 620); },
  djump() { this.tone(450, 0.16, 'square', 0.12, 1000); this.noise(0.12, 0.06, 'highpass', 4000); },
  land()  { this.noise(0.07, 0.12, 'lowpass', 600); },
  collect() { // "psss" + dzwonek
    this.noise(0.14, 0.12, 'highpass', 5000);
    this.tone(1046, 0.09, 'sine', 0.22);
    this.tone(1568, 0.14, 'sine', 0.2, null, 0.06);
  },
  hit() {
    this.tone(240, 0.38, 'sawtooth', 0.28, 50);
    this.noise(0.25, 0.3, 'lowpass', 900);
  },
  bark() { // hau hau!
    [0, 0.2].forEach(dl => {
      this.tone(560, 0.1, 'sawtooth', 0.16, 240, dl);
      this.tone(380, 0.1, 'square', 0.08, 180, dl);
      this.noise(0.09, 0.14, 'bandpass', 1100, dl);
    });
  },
  trick() { this.noise(0.3, 0.1, 'bandpass', 1600); this.tone(500, 0.25, 'triangle', 0.1, 1300); },
  combo() { this.tone(880, 0.08, 'square', 0.1); this.tone(1320, 0.12, 'square', 0.1, null, 0.08); },
  smash() { this.noise(0.3, 0.3, 'lowpass', 1500); this.tone(160, 0.2, 'square', 0.15, 60); },
  shield() { this.tone(1200, 0.3, 'sine', 0.2, 300); this.noise(0.2, 0.1, 'highpass', 3000); },
  superSfx() { // SPECJALNY DŹWIĘK SUPER SKILLA
    const n = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
    n.forEach((f, i) => {
      this.tone(f, 0.16, 'square', 0.13, null, i * 0.07);
      this.tone(f * 1.5, 0.16, 'triangle', 0.08, null, i * 0.07 + 0.02);
    });
    this.tone(2093, 0.8, 'sine', 0.16, 4186, 0.56);
    this.tone(130, 0.7, 'sawtooth', 0.12, 260, 0.5);
    this.noise(0.9, 0.08, 'highpass', 6000, 0.5);
  },
  gameOver() {
    [523, 440, 349, 262, 196].forEach((f, i) => this.tone(f, 0.3, 'square', 0.14, f * 0.97, i * 0.18));
  },
  // prosta muzyczka w tle
  bassPat: [45,0,45,0, 0,45,0,48, 0,48,0,0, 50,0,52,0, 41,0,41,0, 0,41,0,45, 0,43,0,0, 43,0,47,0],
  leadPat: [69,72,76,81, 76,72,69,72, 74,77,81,86, 81,77,74,77],
  updateMusic(superOn) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime, stepDur = 0.105;
    if (this.nextT < now) this.nextT = now + 0.05;
    while (this.nextT < now + 0.2) {
      const s = this.step, dl = this.nextT - now, M = this.music;
      const b = this.bassPat[s];
      if (b) this.tone(440 * Math.pow(2, (b - 69) / 12), 0.1, 'square', 0.13, null, dl, M);
      if (s % 8 === 0) this.tone(150, 0.16, 'sine', 0.7, 40, dl, M);
      if (s % 8 === 4) { this.noise(0.13, 0.35, 'bandpass', 1800, dl, M); this.tone(200, 0.07, 'triangle', 0.2, 120, dl, M); }
      if (s % 2 === 1) this.noise(0.04, 0.14, 'highpass', 7000, dl, M);
      if (superOn) { const l = this.leadPat[s % 16]; this.tone(440 * Math.pow(2, (l - 69) / 12), 0.09, 'square', 0.07, null, dl, M); }
      this.nextT += stepDur; this.step = (this.step + 1) % 32;
    }
  }
};

/* ======================= SKILLE ======================= */
const SKILLS = [
  { id: 'turbo',  name: 'TURBO NIKE',     desc: 'Niezniszczalny! Rozwalasz przeszkody', col: '#ff3b3b', dur: 6 },
  { id: 'magnet', name: 'MAGNES PEPSI',   desc: 'Butelki same lecą do Ciebie',        col: '#3b8bff', dur: 9 },
  { id: 'mega',   name: 'MEGA SKOK',      desc: 'Potrójny, wysoki skok',               col: '#38e07b', dur: 9 },
  { id: 'shield', name: 'TARCZA',         desc: 'Chroni przed jednym uderzeniem',     col: '#ffd23b', dur: 14 },
  { id: 'slowmo', name: 'ZWOLNIONY CZAS', desc: 'Cały świat zwalnia',                  col: '#c76bff', dur: 6 },
];
const TRICKS = ['KICKFLIP', 'HEELFLIP', '360 FLIP', 'TRE FLIP', 'VARIAL', 'HARDFLIP'];

const OBS = {
  cone:    { w: 34, h: 44 },
  trash:   { w: 44, h: 62 },
  barrier: { w: 96, h: 50 },
  boxes:   { w: 56, h: 84 },
  hole:    { w: 88, h: 10 },
  drone:   { w: 64, h: 26 },
};

/* ======================= STAN GRY ======================= */
let state = 'menu';   // menu | play | pause | caught | over
let G = null;
let best = +(localStorage.getItem('skateUcieczkaBest') || 0);
let touchMode = false;
const input = { down: false };

function newGame() {
  G = {
    t: 0, speed: 380, dist: 0, bonus: 0, bottles: 0, lives: 10,
    shake: 0, flash: 0, flashCol: '#fff', overT: 0,
    player: { x: 300, y: GROUND, vy: 0, onGround: true, jumps: 0, crouch: 0,
              trickT: 0, trickSpin: 0, trickDone: false, invuln: 0, fallRot: 0 },
    dog: { gap: 230, x: 0, y: GROUND, vy: 0, onGround: true, barkT: 3, bubble: 0 },
    obstacles: [], bottlesArr: [], particles: [], texts: [],
    nextObs: 700, nextBottle: 250, skill: null, skillT: 0, lastSkill: -1,
    shield: false, combo: 0, banner: null, worldSpeed: 380,
  };
}
newGame();

function startGame() {
  Snd.init();
  newGame();
  state = 'play';
  G.banner = { txt: 'UCIEKAJ!', sub: 'Pies Cię goni!', col: '#ffd23b', t: 0, dur: 1.8 };
  setTimeout(() => Snd.bark(), 300);
}

/* ======================= STEROWANIE ======================= */
function doJump() {
  if (state !== 'play') return;
  const p = G.player;
  const mega = G.skill && G.skill.id === 'mega';
  const maxJ = mega ? 3 : 2, pw = mega ? 1.22 : 1;
  if (p.onGround) {
    p.vy = -JUMP * pw; p.onGround = false; p.jumps = 1; Snd.jump();
    dust(p.x, GROUND, 8);
  } else if (p.jumps < maxJ) {
    p.vy = -DJUMP * pw; p.jumps++; Snd.djump();
    for (let i = 0; i < 10; i++) G.particles.push({ x: p.x, y: p.y, vx: rand(-150, 150), vy: rand(50, 200), life: 0.4, max: 0.4, col: mega ? '#38e07b' : '#ffffff', size: 3 });
  }
}
function doTrick() {
  if (state !== 'play') return;
  const p = G.player;
  if (!p.onGround && p.trickT <= 0 && !p.trickDone) { p.trickT = TRICK_DUR; Snd.trick(); }
}
function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') { state = 'play'; Snd.nextT = 0; }
}
function anyStart() {
  if (state === 'menu') startGame();
  else if (state === 'over' && G.overT > 0.8) startGame();
  else if (state === 'pause') togglePause();
}

addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  Snd.init();
  if (k === 'KeyM') { Snd.setMute(!Snd.muted); return; }
  if (k === 'KeyP' || k === 'Escape') { togglePause(); return; }
  if (state !== 'play') { if (k === 'Space' || k === 'Enter') anyStart(); return; }
  if (e.repeat) { if (k === 'ArrowDown' || k === 'KeyS') input.down = true; return; }
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') doJump();
  else if (k === 'ArrowDown' || k === 'KeyS') input.down = true;
  else if (k === 'KeyX' || k === 'KeyK' || k === 'ShiftLeft' || k === 'ShiftRight' || k === 'ArrowRight' || k === 'KeyD') doTrick();
});
addEventListener('keyup', e => { if (e.code === 'ArrowDown' || e.code === 'KeyS') input.down = false; });

const BTN = {
  jump:  { x: 20,      y: H - 118, w: 170, h: 100, label: 'SKOK' },
  trick: { x: W - 360, y: H - 118, w: 160, h: 100, label: 'TRIK' },
  duck:  { x: W - 190, y: H - 118, w: 170, h: 100, label: 'KUCNIJ' },
  pause: { x: W / 2 - 24, y: 70, w: 48, h: 40, label: 'II' },
};
const inRect = (pt, r) => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
let duckPointer = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Snd.init();
  if (e.pointerType === 'touch') touchMode = true;
  const pt = toCanvas(e);
  if (state !== 'play') { anyStart(); return; }
  if (touchMode && inRect(pt, BTN.pause)) { togglePause(); return; }
  if (touchMode && inRect(pt, BTN.duck)) { input.down = true; duckPointer = e.pointerId; return; }
  if (touchMode && inRect(pt, BTN.trick)) { doTrick(); return; }
  doJump();
});
const releasePointer = e => { if (e.pointerId === duckPointer) { input.down = false; duckPointer = null; } };
cv.addEventListener('pointerup', releasePointer);
cv.addEventListener('pointercancel', releasePointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

/* ======================= EFEKTY ======================= */
function dust(x, y, n) {
  for (let i = 0; i < n; i++) G.particles.push({ x: x + rand(-20, 20), y, vx: rand(-200, 60), vy: rand(-120, -20), life: 0.5, max: 0.5, col: '#cfc6b8', size: rand(2, 4) });
}
function popText(x, y, txt, col = '#fff', size = 22) { G.texts.push({ x, y, txt, col, size, life: 1.1 }); }
function burst(x, y, col, n = 30, sp = 400) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(sp * 0.3, sp);
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1), max: 1, col, size: rand(2, 5), star: Math.random() < 0.4 });
  }
}

/* ======================= SPAWN ======================= */
function spawnObstacle() {
  const d = G.dist;
  const pool = [['cone', 3], ['trash', 2], ['barrier', 2], ['hole', 2]];
  if (d > 1800) pool.push(['drone', 2]);
  if (d > 3000) pool.push(['boxes', 1.6]);
  let tot = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * tot, type = 'cone';
  for (const [n, wgt] of pool) { if ((r -= wgt) <= 0) { type = n; break; } }
  const T = OBS[type];
  const o = { type, x: W + 80, w: T.w, h: T.h, y: GROUND - T.h, ph: Math.random() * 6, hit: false, smashed: false };
  if (type === 'hole') o.y = GROUND - 4;
  if (type === 'drone') o.y = GROUND - 132;
  G.obstacles.push(o);

  // butelki przy przeszkodzie
  if (type === 'drone') {
    if (Math.random() < 0.75) for (let i = 0; i < 4; i++) addBottle(o.x - 40 + i * 48, GROUND - 32);
  } else if (Math.random() < 0.6) {
    const cx = o.x + o.w / 2, n = 5, top = type === 'boxes' ? 175 : 130;
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      addBottle(cx - 130 + k * 260, GROUND - 55 - Math.sin(k * Math.PI) * top);
    }
  }
  const minGap = 430 + G.speed * 0.25;
  G.nextObs = Math.max(minGap, rand(0.85, 1.75) * G.speed) + (type === 'barrier' ? 60 : 0);
}
function addBottle(x, y) { G.bottlesArr.push({ x, y, ph: Math.random() * 6, taken: false }); }
function spawnBottleLine() {
  const high = Math.random() < 0.35, n = 5;
  const y = high ? GROUND - 200 : GROUND - 48;
  for (let i = 0; i < n; i++) addBottle(W + 60 + i * 46, y + (high ? Math.sin(i / (n - 1) * Math.PI) * -20 : 0));
}

/* ======================= SUPER SKILL ======================= */
function triggerSuper() {
  let idx;
  do { idx = Math.floor(Math.random() * SKILLS.length); } while (idx === G.lastSkill);
  G.lastSkill = idx;
  const s = SKILLS[idx];
  G.skill = s; G.skillT = s.dur;
  G.shield = s.id === 'shield';
  const p = G.player;
  let sub = s.desc;
  if (G.lives < 10) { G.lives++; sub += '  •  +1 ŻYCIE ❤'; popText(p.x, p.y - 150, '+1 ŻYCIE', '#ff4d6d', 26); }
  Snd.superSfx();
  G.banner = { txt: s.name + '!', sub, col: s.col, t: 0, dur: 2.2 };
  G.flash = 0.5; G.flashCol = s.col;
  burst(p.x, p.y - 60, s.col, 60, 520);
  burst(p.x, p.y - 60, '#ffffff', 25, 300);
}
function endSkill() {
  if (G.skill && G.skill.id === 'shield') G.shield = false;
  G.skill = null; G.skillT = 0;
}

/* ======================= UPDATE ======================= */
function playerBox() {
  const p = G.player, h = 118 - 46 * p.crouch;
  return { x: p.x - 18, y: p.y - h, w: 36, h: h - 4 };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function hurt(o) {
  const p = G.player;
  if (o.hit || o.smashed) return;
  if (G.skill && G.skill.id === 'turbo') { smash(o); return; }
  if (p.invuln > 0) return;
  if (G.shield) {
    G.shield = false; if (G.skill && G.skill.id === 'shield') endSkill();
    smash(o); p.invuln = 0.8; Snd.shield();
    popText(p.x, p.y - 140, 'TARCZA OCHRONIŁA!', '#ffd23b', 24); return;
  }
  o.hit = true;
  G.lives--; p.invuln = 1.6; G.shake = 0.4; G.combo = 0;
  G.flash = 0.25; G.flashCol = '#ff0000';
  G.dog.gap = Math.max(70, G.dog.gap - 45);
  Snd.hit(); setTimeout(() => Snd.bark(), 250); G.dog.bubble = 1;
  burst(p.x, p.y - 50, '#ff4d4d', 18, 260);
  popText(p.x, p.y - 140, '-1 ŻYCIE', '#ff4d4d', 26);
  if (p.trickT > 0) { p.trickT = 0; p.trickSpin = 0; }
  if (G.lives <= 0) { state = 'caught'; G.overT = 0; Snd.gameOver(); setTimeout(() => Snd.bark(), 400); }
}
function smash(o) {
  o.smashed = true; o.vx = rand(350, 650); o.vy = -rand(450, 750); o.rot = 0; o.vr = rand(-10, 10);
  G.bonus += 50; Snd.smash(); G.shake = Math.max(G.shake, 0.2);
  burst(o.x + o.w / 2, o.y + o.h / 2, '#ffae00', 20, 350);
  popText(o.x, o.y - 10, 'BUM! +50', '#ffae00', 22);
}

function update(dt) {
  G.t += dt;
  const p = G.player, dog = G.dog;
  if (G.skill) { G.skillT -= dt; if (G.skillT <= 0) endSkill(); }
  const sid = G.skill ? G.skill.id : null;

  G.speed = Math.min(880, 380 + G.t * 7);
  let ws = G.speed;
  if (sid === 'turbo') ws *= 1.6;
  if (sid === 'slowmo') ws *= 0.55;
  G.worldSpeed = lerp(G.worldSpeed, ws, Math.min(1, dt * 4));
  const dx = G.worldSpeed * dt;
  G.dist += dx;

  // gracz
  p.crouch = lerp(p.crouch, input.down && p.onGround ? 1 : 0, Math.min(1, dt * 14));
  if (!p.onGround) {
    p.vy += GRAV * dt * (input.down ? 2.2 : 1);
    p.y += p.vy * dt;
    if (p.y >= GROUND) {
      p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 0; Snd.land(); dust(p.x, GROUND, 6);
      if (p.trickDone) {
        G.combo++;
        const pts = 150 * G.combo;
        G.bonus += pts;
        popText(p.x, p.y - 150, `${TRICKS[Math.floor(Math.random() * TRICKS.length)]} +${pts}`, '#7df9ff', 24);
        if (G.combo > 1) { popText(p.x + 10, p.y - 178, `COMBO x${G.combo}`, '#ffd23b', 20); Snd.combo(); }
      } else if (p.trickT > 0) {
        popText(p.x, p.y - 140, 'UPS!', '#ffffff', 22); G.combo = 0;
      }
      p.trickT = 0; p.trickSpin = 0; p.trickDone = false;
    }
  }
  if (p.trickT > 0) {
    p.trickT -= dt; p.trickSpin = 1 - p.trickT / TRICK_DUR;
    if (p.trickT <= 0) { p.trickT = 0; p.trickSpin = 0; p.trickDone = true; }
  }
  if (p.invuln > 0) p.invuln -= dt;

  // spawn
  G.nextObs -= dx;
  if (G.nextObs <= 0) spawnObstacle();
  G.nextBottle -= dx;
  if (G.nextBottle <= 0) {
    if (G.nextObs > 320) { spawnBottleLine(); G.nextBottle = rand(650, 1300); }
    else G.nextBottle = 120;
  }

  // przeszkody
  const pb = playerBox();
  for (const o of G.obstacles) {
    if (o.smashed) {
      o.x += (o.vx - G.worldSpeed * 0.3) * dt; o.vy += GRAV * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
      continue;
    }
    o.x -= dx;
    if (o.type === 'drone') o.ph += dt;
    if (o.hit) continue;
    if (o.type === 'hole') {
      if (p.onGround && p.x > o.x + 14 && p.x < o.x + o.w - 14) hurt(o);
    } else {
      const ob = { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 6 };
      if (overlap(pb, ob)) hurt(o);
    }
  }
  G.obstacles = G.obstacles.filter(o => o.x > -200 && o.y < H + 200);

  // butelki
  const pcx = p.x, pcy = p.y - (118 - 46 * p.crouch) / 2;
  for (const b of G.bottlesArr) {
    b.x -= dx; b.ph += dt * 4;
    if (sid === 'magnet') {
      const ddx = pcx - b.x, ddy = pcy - b.y, dd = Math.hypot(ddx, ddy);
      if (dd < 450 && b.x > pcx - 100) { const s = Math.min(1, dt * 9); b.x += ddx * s; b.y += ddy * s; }
    }
    if (!b.taken && Math.abs(b.x - pcx) < 34 && Math.abs(b.y - pcy) < (118 - 46 * p.crouch) / 2 + 20) {
      b.taken = true; G.bottles++; G.bonus += 50; Snd.collect();
      for (let i = 0; i < 10; i++) G.particles.push({ x: b.x, y: b.y, vx: rand(-120, 120), vy: rand(-220, -40), life: 0.6, max: 0.6, col: i % 2 ? '#5aa9ff' : '#ffffff', size: rand(2, 4), bubble: true });
      popText(b.x, b.y - 20, '+50', '#8fd0ff', 18);
      if (G.bottles % 10 === 0) triggerSuper();
    }
  }
  G.bottlesArr = G.bottlesArr.filter(b => !b.taken && b.x > -60);

  // pies
  const maxGap = sid === 'turbo' ? 340 : 230;
  if (dog.gap < maxGap) dog.gap = Math.min(maxGap, dog.gap + (sid === 'turbo' ? 60 : 9) * dt);
  else dog.gap = lerp(dog.gap, maxGap, Math.min(1, dt));
  updateDog(dt, p.x - dog.gap - 70);
  dog.barkT -= dt;
  if (dog.barkT <= 0) { Snd.bark(); dog.bubble = 1; dog.barkT = dog.gap < 150 ? rand(1.5, 3) : rand(4, 8); }

  // turbo ślad
  if (sid === 'turbo') for (let i = 0; i < 2; i++) G.particles.push({ x: p.x - 30, y: p.y - rand(5, 100), vx: -rand(300, 600), vy: rand(-30, 30), life: 0.35, max: 0.35, col: Math.random() < 0.5 ? '#ff3b3b' : '#ffae00', size: rand(3, 6) });
  if (sid === 'mega' && Math.random() < 0.4) G.particles.push({ x: p.x + rand(-20, 20), y: p.y - rand(0, 110), vx: -100, vy: -60, life: 0.5, max: 0.5, col: '#38e07b', size: 3, star: true });

  updateFx(dt);
}

function updateDog(dt, targetX) {
  const dog = G.dog;
  dog.x = lerp(dog.x || targetX, targetX, Math.min(1, dt * 5));
  if (dog.onGround) {
    for (const o of G.obstacles) {
      if (o.smashed || o.type === 'drone') continue;
      const ahead = o.x - (dog.x + 60);
      if (ahead > -10 && ahead < 45) { dog.vy = -760; dog.onGround = false; break; }
    }
  } else {
    dog.vy += GRAV * dt; dog.y += dog.vy * dt;
    if (dog.y >= GROUND) { dog.y = GROUND; dog.vy = 0; dog.onGround = true; }
  }
  if (dog.bubble > 0) dog.bubble -= dt * 1.4;
}

function updateFx(dt) {
  for (const q of G.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.bubble ? -200 : 500) * dt; q.life -= dt; }
  G.particles = G.particles.filter(q => q.life > 0);
  for (const t of G.texts) { t.y -= 45 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.5);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
}

function updateCaught(dt) {
  G.overT += dt;
  const p = G.player;
  G.worldSpeed = lerp(G.worldSpeed, 0, Math.min(1, dt * 2.5));
  const dx = G.worldSpeed * dt;
  G.dist += dx;
  for (const o of G.obstacles) if (!o.smashed) o.x -= dx;
  for (const b of G.bottlesArr) b.x -= dx;
  if (!p.onGround) { p.vy += GRAV * dt; p.y += p.vy * dt; if (p.y >= GROUND) { p.y = GROUND; p.onGround = true; } }
  p.fallRot = lerp(p.fallRot, -1.35, Math.min(1, dt * 4));
  G.dog.gap = lerp(G.dog.gap, -20, Math.min(1, dt * 3));
  updateDog(dt, p.x - G.dog.gap - 70);
  if (G.overT > 0.6 && G.overT < 0.65) G.dog.bubble = 1;
  updateFx(dt);
  if (G.overT > 2.2) {
    state = 'over'; G.overT = 0;
    const sc = score();
    if (sc > best) { best = sc; localStorage.setItem('skateUcieczkaBest', best); G.newBest = true; }
  }
}

function updateMenu(dt) {
  G.t += dt; G.dist += 220 * dt; G.worldSpeed = 220;
  G.player.crouch = 0;
  updateDog(dt, G.player.x - 200 - 70 + Math.sin(G.t * 0.8) * 30);
  if (G.dog.bubble > 0) G.dog.bubble -= dt;
  G.dog.barkT -= dt;
  if (G.dog.barkT <= 0) { G.dog.bubble = 1; G.dog.barkT = rand(3, 5); }
}

const score = () => Math.floor(G.dist / 8) + G.bonus;

/* ======================= RYSOWANIE ======================= */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function text(str, x, y, size, col, align = 'left', stroke = 4, strokeCol = '#000') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = strokeCol; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
// Logo "swoosh"
function swoosh(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, Math.abs(s)); ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-0.72, -0.08);
  ctx.bezierCurveTo(-1.15, 0.38, -0.92, 0.66, -0.42, 0.52);
  ctx.lineTo(1.15, -0.38);
  ctx.lineTo(-0.38, 0.24);
  ctx.bezierCurveTo(-0.72, 0.34, -0.86, 0.18, -0.72, -0.08);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x - s * 0.1, y + s * 0.75, x, y + s);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.75, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
  ctx.closePath();
}

// ---------- tło: dzień / zachód / noc ----------
function skyState() {
  const ph = (G.dist / 36000) % 1;
  // 0-0.4 dzień, 0.4-0.5 zachód, 0.5-0.85 noc, 0.85-1 świt
  let night = 0, dusk = 0;
  if (ph < 0.4) night = 0;
  else if (ph < 0.5) { const k = (ph - 0.4) / 0.1; night = k; dusk = Math.sin(k * Math.PI); }
  else if (ph < 0.85) night = 1;
  else { const k = (ph - 0.85) / 0.15; night = 1 - k; dusk = Math.sin(k * Math.PI) * 0.8; }
  return { night, dusk, ph };
}
function drawBackground() {
  const { night, dusk, ph } = skyState();
  const top = mixCol(mixCol([88, 176, 255], [12, 18, 52], night), [255, 110, 80], dusk * 0.6);
  const bot = mixCol(mixCol([200, 235, 255], [40, 50, 100], night), [255, 190, 110], dusk * 0.8);
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);

  // gwiazdy
  if (night > 0.05) {
    ctx.fillStyle = `rgba(255,255,255,${night * 0.9})`;
    for (let i = 0; i < 70; i++) {
      const x = (hash(i) * W * 1.2 - G.dist * 0.01) % (W * 1.2);
      const xx = x < 0 ? x + W * 1.2 : x;
      const tw = 0.5 + 0.5 * Math.sin(G.t * 3 + i);
      ctx.globalAlpha = night * (0.4 + tw * 0.6);
      ctx.fillRect(xx, hash(i + 99) * 260, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // słońce / księżyc
  const sunK = ph < 0.5 ? ph / 0.5 : null;
  if (sunK !== null) {
    const sx = 120 + sunK * 760, sy = 330 - Math.sin(sunK * Math.PI) * 260;
    ctx.fillStyle = 'rgba(255,240,150,0.25)'; circle(sx, sy, 60); ctx.fill();
    ctx.fillStyle = dusk > 0.3 ? '#ffb14a' : '#fff3a0'; circle(sx, sy, 38); ctx.fill();
  } else {
    const mk = (ph - 0.5) / 0.5, mx = 120 + mk * 760, my = 330 - Math.sin(mk * Math.PI) * 250;
    ctx.fillStyle = 'rgba(220,230,255,0.15)'; circle(mx, my, 55); ctx.fill();
    ctx.fillStyle = '#eef2ff'; circle(mx, my, 30); ctx.fill();
    ctx.fillStyle = rgb(top); circle(mx + 12, my - 6, 26); ctx.fill();
  }
  // chmury
  for (let i = 0; i < 6; i++) {
    const span = W + 300;
    let x = (hash(i + 7) * span - G.dist * 0.06) % span; if (x < 0) x += span; x -= 150;
    const y = 50 + hash(i + 3) * 130, s = 0.6 + hash(i + 11) * 0.8;
    ctx.fillStyle = rgb(mixCol([255, 255, 255], [90, 100, 140], night), 0.85);
    circle(x, y, 26 * s); ctx.fill(); circle(x + 30 * s, y - 12 * s, 32 * s); ctx.fill();
    circle(x + 62 * s, y, 24 * s); ctx.fill(); rr(x - 10 * s, y, 90 * s, 22 * s, 11 * s); ctx.fill();
  }
  // daleka panorama
  const farCol = mixCol(mixCol([120, 150, 190], [25, 30, 60], night), [170, 110, 120], dusk * 0.5);
  ctx.fillStyle = rgb(farCol);
  const fo = G.dist * 0.18, fw = 64;
  for (let i = Math.floor(fo / fw) - 1; i < (fo + W) / fw + 1; i++) {
    const h = 80 + hash(i) * 150, x = i * fw - fo;
    ctx.fillRect(x, GROUND - 30 - h, fw - 4, h + 30);
    if (hash(i + 50) > 0.7) ctx.fillRect(x + fw / 2 - 2, GROUND - 30 - h - 25, 3, 25);
  }
  // bliższe budynki z oknami
  const no = G.dist * 0.42, nw = 150;
  for (let i = Math.floor(no / nw) - 1; i < (no + W) / nw + 1; i++) {
    if (hash(i * 3.1) < 0.18) continue;
    const bw = 110 + hash(i + 1.5) * 35, h = 120 + hash(i + 2.7) * 140, x = i * nw - no;
    const base = [[190, 90, 70], [90, 120, 150], [160, 150, 130], [110, 90, 130], [70, 130, 110]][Math.floor(hash(i + 9) * 5)];
    const bc = mixCol(mixCol(base, [20, 22, 40], night * 0.75), [255, 140, 90], dusk * 0.2);
    ctx.fillStyle = rgb(bc); ctx.fillRect(x, GROUND - 30 - h, bw, h + 30);
    ctx.fillStyle = rgb(mixCol(bc, [0, 0, 0], 0.3)); ctx.fillRect(x, GROUND - 30 - h, bw, 8);
    for (let wy = GROUND - 30 - h + 20; wy < GROUND - 60; wy += 30) {
      for (let wx = x + 12; wx < x + bw - 20; wx += 26) {
        const lit = hash(wx * 0.37 + wy * 1.7 + i) > 0.45;
        ctx.fillStyle = night > 0.3 && lit ? `rgba(255,220,120,${0.5 + night * 0.5})` : rgb(mixCol([170, 210, 240], [30, 40, 70], night));
        ctx.fillRect(wx, wy, 14, 18);
      }
    }
  }
  // chodnik
  ctx.fillStyle = rgb(mixCol([170, 170, 178], [60, 62, 80], night));
  ctx.fillRect(0, GROUND - 30, W, 30);
  ctx.strokeStyle = rgb(mixCol([140, 140, 150], [45, 47, 62], night)); ctx.lineWidth = 2;
  const so = G.dist % 60;
  for (let x = -so; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, GROUND - 30); ctx.lineTo(x - 10, GROUND); ctx.stroke(); }
  // latarnie
  const lo = G.dist, lw = 480;
  for (let i = Math.floor(lo / lw) - 1; i < (lo + W) / lw + 1; i++) {
    const x = i * lw - lo + 200;
    ctx.fillStyle = '#2b2d36'; ctx.fillRect(x - 3, GROUND - 210, 6, 190);
    ctx.fillRect(x - 3, GROUND - 210, 30, 5); ctx.fillRect(x - 7, GROUND - 24, 14, 6);
    ctx.fillStyle = night > 0.3 ? '#fff3b0' : '#ddd'; rr(x + 16, GROUND - 207, 20, 8, 3); ctx.fill();
    if (night > 0.3) {
      const lg = ctx.createRadialGradient(x + 26, GROUND - 200, 5, x + 26, GROUND - 120, 140);
      lg.addColorStop(0, `rgba(255,230,140,${0.35 * night})`); lg.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(x + 18, GROUND - 200); ctx.lineTo(x - 50, GROUND + 20); ctx.lineTo(x + 100, GROUND + 20); ctx.lineTo(x + 34, GROUND - 200); ctx.fill();
    }
  }
  // krawężnik i ulica
  ctx.fillStyle = rgb(mixCol([215, 215, 220], [90, 92, 110], night)); ctx.fillRect(0, GROUND - 3, W, 6);
  ctx.fillStyle = rgb(mixCol([62, 62, 70], [30, 30, 40], night)); ctx.fillRect(0, GROUND + 3, W, H - GROUND);
  ctx.fillStyle = rgb(mixCol([240, 220, 90], [150, 140, 70], night));
  const ro = G.dist % 120;
  for (let x = -ro; x < W; x += 120) ctx.fillRect(x, GROUND + 50, 60, 6);
}

// ---------- przeszkody ----------
function drawObstacle(o) {
  ctx.save();
  if (o.smashed) { ctx.translate(o.x + o.w / 2, o.y + o.h / 2); ctx.rotate(o.rot); ctx.translate(-o.w / 2, -o.h / 2); }
  else ctx.translate(o.x, o.y);
  const w = o.w, h = o.h;
  switch (o.type) {
    case 'cone':
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath(); ctx.moveTo(w / 2 - 5, 0); ctx.lineTo(w / 2 + 5, 0); ctx.lineTo(w - 3, h - 6); ctx.lineTo(3, h - 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(w * 0.3, h * 0.3, w * 0.4, 6); ctx.fillRect(w * 0.2, h * 0.6, w * 0.6, 6);
      ctx.fillStyle = '#222'; rr(-3, h - 7, w + 6, 7, 2); ctx.fill();
      break;
    case 'trash':
      ctx.fillStyle = '#3f6e4b'; rr(3, 8, w - 6, h - 8, 4); ctx.fill();
      ctx.fillStyle = '#335a3d'; for (let x = 10; x < w - 6; x += 9) ctx.fillRect(x, 14, 3, h - 22);
      ctx.fillStyle = '#4f8a5e'; rr(0, 0, w, 10, 4); ctx.fill();
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(w / 2 - 6, -4, 12, 5);
      break;
    case 'barrier':
      ctx.fillStyle = '#555'; ctx.fillRect(10, 14, 6, h - 14); ctx.fillRect(w - 16, 14, 6, h - 14);
      ctx.fillRect(4, h - 4, 18, 4); ctx.fillRect(w - 22, h - 4, 18, 4);
      ctx.save(); rr(0, 0, w, 20, 3); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, 20);
      ctx.fillStyle = '#e02424';
      for (let x = -20; x < w + 20; x += 24) { ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x + 12, 0); ctx.lineTo(x + 24, 0); ctx.lineTo(x + 12, 20); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = '#ffcc00'; circle(13, -2, 4); ctx.fill(); circle(w - 13, -2, 4); ctx.fill();
      break;
    case 'boxes':
      for (let i = 0; i < 2; i++) {
        const by = i * (h / 2);
        ctx.fillStyle = '#b47a3c'; ctx.fillRect(0, by, w, h / 2 - 2);
        ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = 3; ctx.strokeRect(2, by + 2, w - 4, h / 2 - 6);
        ctx.beginPath(); ctx.moveTo(2, by + 2); ctx.lineTo(w - 2, by + h / 2 - 4); ctx.moveTo(w - 2, by + 2); ctx.lineTo(2, by + h / 2 - 4); ctx.stroke();
      }
      break;
    case 'hole':
      ctx.fillStyle = '#16161a'; ctx.beginPath(); ctx.ellipse(w / 2, 9, w / 2, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0a0c'; ctx.beginPath(); ctx.ellipse(w / 2, 10, w / 2 - 8, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#26262c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(-14, 16); ctx.moveTo(w, 9); ctx.lineTo(w + 12, 3); ctx.moveTo(w, 10); ctx.lineTo(w + 16, 18); ctx.stroke();
      // znak ostrzegawczy
      ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.moveTo(w / 2, -44); ctx.lineTo(w / 2 + 14, -20); ctx.lineTo(w / 2 - 14, -20); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillRect(w / 2 - 1.5, -38, 3, 10); ctx.fillRect(w / 2 - 1.5, -26, 3, 3);
      ctx.fillStyle = '#555'; ctx.fillRect(w / 2 - 1.5, -20, 3, 22);
      break;
    case 'drone': {
      const bob = Math.sin(o.ph * 5) * 4;
      ctx.translate(0, bob);
      ctx.fillStyle = '#2d2f38'; rr(12, 8, w - 24, 14, 5); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(2, 6, w - 4, 4);
      ctx.fillStyle = '#9aa'; ctx.fillRect(4, 0, 4, 8); ctx.fillRect(w - 8, 0, 4, 8);
      const sp = Math.abs(Math.sin(G.t * 50)) * 14 + 4;
      ctx.fillStyle = 'rgba(200,220,255,0.7)'; ctx.fillRect(6 - sp, -1, sp * 2, 3); ctx.fillRect(w - 6 - sp, -1, sp * 2, 3);
      ctx.fillStyle = Math.sin(G.t * 10) > 0 ? '#ff2a2a' : '#661010'; circle(w / 2, 22, 3); ctx.fill();
      ctx.fillStyle = '#111'; circle(w / 2, 15, 4); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

// ---------- butelka Pepsi ----------
function drawBottle(x, y, ph) {
  ctx.save(); ctx.translate(x, y + Math.sin(ph) * 4); ctx.rotate(Math.sin(ph * 0.7) * 0.12);
  // poświata
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
  gl.addColorStop(0, 'rgba(90,170,255,0.45)'); gl.addColorStop(1, 'rgba(90,170,255,0)');
  ctx.fillStyle = gl; circle(0, 0, 30); ctx.fill();
  // butelka
  ctx.fillStyle = '#0a2f7a';
  ctx.beginPath();
  ctx.moveTo(-4, -20); ctx.lineTo(4, -20); ctx.lineTo(4, -14);
  ctx.quadraticCurveTo(10, -10, 10, -2); ctx.lineTo(10, 15);
  ctx.quadraticCurveTo(10, 20, 5, 20); ctx.lineTo(-5, 20);
  ctx.quadraticCurveTo(-10, 20, -10, 15); ctx.lineTo(-10, -2);
  ctx.quadraticCurveTo(-10, -10, -4, -14); ctx.closePath(); ctx.fill();
  // nakrętka
  ctx.fillStyle = '#1f6bff'; rr(-5, -25, 10, 6, 1.5); ctx.fill();
  // etykieta
  ctx.fillStyle = '#0050b4'; ctx.fillRect(-10, -3, 20, 14);
  ctx.save(); circle(0, 4, 6); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.fillRect(-7, -3, 14, 14);
  ctx.fillStyle = '#e32934'; ctx.beginPath(); ctx.moveTo(-7, -3); ctx.lineTo(7, -3); ctx.lineTo(7, 1); ctx.quadraticCurveTo(0, 6, -7, 3); ctx.fill();
  ctx.fillStyle = '#005cb4'; ctx.beginPath(); ctx.moveTo(-7, 6); ctx.quadraticCurveTo(0, 3, 7, 6.5); ctx.lineTo(7, 11); ctx.lineTo(-7, 11); ctx.fill();
  ctx.restore();
  // odblask
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-7, -6, 2.5, 20);
  ctx.restore();
}

// ---------- chłopak na deskorolce ----------
function drawBoy(p) {
  const c = p.crouch;
  ctx.save(); ctx.translate(p.x, p.y);
  if (state === 'play' && p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.35;
  const air = !p.onGround;
  const lean = air ? clamp(p.vy / 3500, -0.15, 0.15) : Math.sin(G.t * 2) * 0.02;
  ctx.rotate(lean);

  // deskorolka
  ctx.save(); ctx.translate(0, -9);
  if (p.trickT > 0) ctx.scale(1, Math.cos(p.trickSpin * Math.PI * 2));
  ctx.fillStyle = '#e8442e'; rr(-42, -5, 84, 8, 4); ctx.fill();
  ctx.fillStyle = '#ffd23b'; ctx.fillRect(-30, -1, 60, 2);
  ctx.fillStyle = '#1a1a1a'; rr(-40, -6, 80, 3, 2); ctx.fill();
  ctx.fillStyle = '#9aa0a8'; ctx.fillRect(-29, 3, 12, 3); ctx.fillRect(17, 3, 12, 3);
  const wr = state === 'play' || state === 'menu' ? G.t * 20 : 0;
  for (const wx of [-23, 23]) {
    ctx.fillStyle = '#f4f4f4'; circle(wx, 8, 5); ctx.fill();
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(wx, 8); ctx.lineTo(wx + Math.cos(wr) * 4, 8 + Math.sin(wr) * 4); ctx.stroke();
  }
  ctx.restore();

  // przewrót przy złapaniu
  if (state === 'caught' || state === 'over') { ctx.translate(-10, -14); ctx.rotate(p.fallRot); ctx.translate(10, 14); }

  const lift = p.trickT > 0 ? Math.sin(p.trickSpin * Math.PI) * 18 : 0;
  ctx.translate(0, -14 - lift);
  const legLen = 40 - 20 * c, hipY = -legLen;

  // nogi (jeansy)
  ctx.strokeStyle = '#2b3a67'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-5, hipY); ctx.lineTo(-10 + 8 * c, hipY / 2); ctx.lineTo(-17, -5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, hipY); ctx.lineTo(16 + 8 * c, hipY / 2); ctx.lineTo(17, -5); ctx.stroke();

  // buty Nike (białe, czarne logo)
  for (const fx of [-17, 17]) {
    ctx.fillStyle = '#ffffff'; rr(fx - 9, -10, 21, 10, 4); ctx.fill();
    ctx.fillStyle = '#d0d0d0'; ctx.fillRect(fx - 9, -3, 21, 3);
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1; rr(fx - 9, -10, 21, 10, 4); ctx.stroke();
    swoosh(fx + 1, -6, -6.5, '#111');
  }

  // tułów – czarna bluza
  ctx.save(); ctx.translate(0, hipY); ctx.rotate(0.08 + 0.55 * c);
  const th = 38 - 6 * c;
  // kaptur z tyłu
  ctx.fillStyle = '#0c0c0c'; rr(-15, -th - 6, 16, 14, 6); ctx.fill();
  // ręka tylna
  const sw = Math.sin(G.t * 3);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-4, -th + 7); ctx.lineTo(-18, -th + 18 + sw * 4); ctx.lineTo(-26, -th + 10 + sw * 6); ctx.stroke();
  ctx.fillStyle = '#f1c27d'; circle(-27, -th + 9 + sw * 6, 4); ctx.fill();
  // korpus
  ctx.fillStyle = '#161616'; rr(-13, -th, 26, th + 4, 8); ctx.fill();
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(-13, -3, 26, 6);
  ctx.fillStyle = '#242424'; rr(-8, -15, 16, 9, 3); ctx.fill();
  ctx.strokeStyle = '#e6e6e6'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(4, -th + 3); ctx.lineTo(4, -th + 13); ctx.moveTo(8, -th + 3); ctx.lineTo(8.5, -th + 11); ctx.stroke();
  swoosh(-4, -th + 13, 4.5, '#ffffff');
  // ręka przednia
  ctx.strokeStyle = '#1c1c1c'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(4, -th + 7); ctx.lineTo(16, -th + 18 - sw * 4); ctx.lineTo(28, -th + 14 - sw * 5); ctx.stroke();
  ctx.fillStyle = '#f1c27d'; circle(29, -th + 13 - sw * 5, 4); ctx.fill();

  // głowa
  const hx = 3, hy = -th - 13;
  ctx.fillStyle = '#e8b878'; ctx.fillRect(hx - 4, hy + 8, 8, 6);
  ctx.fillStyle = '#f1c27d'; circle(hx, hy, 12); ctx.fill();
  ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.arc(hx - 2, hy - 1, 12, Math.PI * 0.55, Math.PI * 1.15); ctx.lineTo(hx - 4, hy - 4); ctx.fill();
  ctx.fillStyle = '#e8b070'; circle(hx - 3, hy + 1, 3); ctx.fill();
  ctx.fillStyle = '#111'; circle(hx + 7, hy - 1, 1.8); ctx.fill();
  ctx.strokeStyle = '#7a3b2a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(hx + 7, hy + 5, 3.2, 0.1, Math.PI * 0.75); ctx.stroke();
  // biała czapka z czarnym logo
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(hx, hy - 3, 13, Math.PI, 0); ctx.lineTo(hx + 13, hy - 2); ctx.lineTo(hx - 13, hy - 2); ctx.closePath(); ctx.fill();
  rr(hx + 6, hy - 5, 19, 5, 2.5); ctx.fill();
  ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(hx, hy - 3, 13, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#e5e5e5'; ctx.fillRect(hx + 6, hy - 1.5, 19, 1.5);
  ctx.fillStyle = '#ddd'; circle(hx, hy - 16, 2); ctx.fill();
  swoosh(hx + 1, hy - 9, 7, '#111');
  ctx.restore();

  ctx.restore();

  // tarcza
  if (G.shield) {
    const r = 74 + Math.sin(G.t * 6) * 3;
    ctx.save();
    const sg = ctx.createRadialGradient(p.x, p.y - 58, r * 0.5, p.x, p.y - 58, r);
    sg.addColorStop(0, 'rgba(255,210,60,0)'); sg.addColorStop(0.85, 'rgba(255,210,60,0.25)'); sg.addColorStop(1, 'rgba(255,240,150,0.7)');
    ctx.fillStyle = sg; circle(p.x, p.y - 58, r); ctx.fill();
    ctx.restore();
  }
  // aura turbo / mega
  if (G.skill && (G.skill.id === 'turbo' || G.skill.id === 'mega')) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const ag = ctx.createRadialGradient(p.x, p.y - 55, 10, p.x, p.y - 55, 90);
    ag.addColorStop(0, G.skill.col + '55'); ag.addColorStop(1, G.skill.col + '00');
    ctx.fillStyle = ag; circle(p.x, p.y - 55, 90); ctx.fill(); ctx.restore();
  }
}

// ---------- pies ----------
function drawDog(d) {
  ctx.save(); ctx.translate(d.x, d.y);
  const run = G.t * 17;
  const bob = d.onGround ? -Math.abs(Math.sin(run)) * 5 : 0;
  ctx.translate(0, bob);
  if (!d.onGround) ctx.rotate(clamp(d.vy / 3000, -0.25, 0.25));
  const leg = (x, y, a, col) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 24); ctx.stroke();
    ctx.fillStyle = col; rr(-4, 22, 11, 6, 3); ctx.fill();
    ctx.restore();
  };
  const sw = d.onGround ? 0.75 : 0.2;
  // ogon
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-38, -46); ctx.quadraticCurveTo(-55, -50, -60, -66 + Math.sin(G.t * 22) * 7); ctx.stroke();
  // dalsze nogi
  leg(-26, -34, Math.sin(run + 0.6) * sw, '#6d4320');
  leg(22, -34, Math.sin(run + Math.PI + 0.6) * sw, '#6d4320');
  // tułów
  ctx.fillStyle = '#a0652e'; ctx.beginPath(); ctx.ellipse(-4, -42, 42, 17, -0.05, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c4874a'; ctx.beginPath(); ctx.ellipse(-2, -34, 30, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4a1f'; ctx.beginPath(); ctx.ellipse(-14, -50, 12, 7, 0.2, 0, Math.PI * 2); ctx.fill();
  // bliższe nogi
  leg(-30, -34, Math.sin(run) * sw, '#a0652e');
  leg(26, -34, Math.sin(run + Math.PI) * sw, '#a0652e');
  // szyja + obroża
  ctx.fillStyle = '#a0652e'; ctx.beginPath(); ctx.ellipse(30, -54, 12, 16, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e02424'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(24, -64); ctx.lineTo(34, -46); ctx.stroke();
  ctx.fillStyle = '#ffd23b'; circle(33, -45, 3.5); ctx.fill();
  // głowa
  ctx.fillStyle = '#a0652e'; circle(42, -66, 16); ctx.fill();
  ctx.fillStyle = '#b8783c'; ctx.beginPath(); ctx.ellipse(58, -60, 14, 9, 0.1, 0, Math.PI * 2); ctx.fill();
  // otwarta paszcza
  const mo = 3 + Math.abs(Math.sin(G.t * 9)) * 4 + (d.bubble > 0 ? 4 : 0);
  ctx.fillStyle = '#5a1010'; ctx.beginPath(); ctx.moveTo(48, -56); ctx.lineTo(70, -56); ctx.lineTo(66, -56 + mo); ctx.lineTo(50, -55 + mo * 0.7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(60, -56); ctx.lineTo(62, -52); ctx.lineTo(64, -56); ctx.fill();
  ctx.beginPath(); ctx.moveTo(66, -56); ctx.lineTo(67.5, -52.5); ctx.lineTo(69, -56); ctx.fill();
  ctx.fillStyle = '#ff6f91'; ctx.beginPath(); ctx.ellipse(56, -50 + mo * 0.6, 5, 7, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; circle(71, -63, 4.5); ctx.fill();
  // ucho
  ctx.fillStyle = '#5c3a1a'; ctx.save(); ctx.translate(36, -76); ctx.rotate(-0.4 + Math.sin(run) * 0.3);
  ctx.beginPath(); ctx.ellipse(-4, 8, 7, 14, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // oko + gniewna brew
  ctx.fillStyle = '#fff'; circle(49, -70, 4.5); ctx.fill();
  ctx.fillStyle = '#111'; circle(51, -70, 2.4); ctx.fill();
  ctx.strokeStyle = '#3a220d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(43, -79); ctx.lineTo(55, -74); ctx.stroke();
  ctx.restore();

  // dymek HAU!
  if (d.bubble > 0) {
    const bx = d.x + 70, by = d.y - 112 + bob, a = Math.min(1, d.bubble * 2);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#fff'; rr(bx - 34, by - 18, 76, 34, 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 14, by + 14); ctx.lineTo(bx - 24, by + 28); ctx.lineTo(bx - 2, by + 14); ctx.fill();
    text('HAU!', bx + 4, by - 1, 20, '#d11', 'center', 0);
    ctx.restore();
  }
}

// ---------- HUD ----------
function drawHUD() {
  // życia
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(10, 10, 300, 82, 12); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const x = 32 + i * 28, y = 18;
    heart(x, y, 22);
    if (i < G.lives) {
      ctx.fillStyle = '#ff2d55'; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; circle(x - 5, y + 7, 2.5); ctx.fill();
    } else { ctx.fillStyle = 'rgba(40,40,40,0.8)'; ctx.fill(); }
    heart(x, y, 22); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  }
  // butelki + pasek super
  drawBottle(32, 66, 0);
  text('× ' + G.bottles, 50, 66, 20, '#fff', 'left', 4);
  const seg = G.bottles % 10;
  text('SUPER', 132, 66, 13, '#ffd23b', 'left', 3);
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i < seg ? (i === 9 ? '#ffd23b' : '#3b8bff') : 'rgba(255,255,255,0.15)';
    rr(186 + i * 11.5, 58, 9, 16, 2); ctx.fill();
  }
  // wynik
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(W - 250, 10, 240, 82, 12); ctx.fill();
  text(String(score()).padStart(6, '0'), W - 22, 34, 30, '#fff', 'right', 5);
  text(Math.floor(G.dist / 20) + ' m', W - 22, 70, 18, '#9fe3ff', 'right', 4);
  text('REKORD ' + best, W - 238, 70, 14, '#ffd23b', 'left', 3);
  if (G.combo > 1) text('COMBO x' + G.combo, W - 238, 34, 16, '#7df9ff', 'left', 3);
  // aktywny skill
  if (G.skill) {
    const s = G.skill, k = G.skillT / s.dur, bw = 260;
    text(s.name, W / 2, 26, 22, s.col, 'center', 5);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(W / 2 - bw / 2, 42, bw, 12, 6); ctx.fill();
    ctx.fillStyle = s.col; rr(W / 2 - bw / 2 + 2, 44, (bw - 4) * k, 8, 4); ctx.fill();
  }
  if (Snd.muted) text('🔇 M', W / 2 + (G.skill ? 170 : 0), 26, 16, '#fff', 'center', 3);
}

function drawButtons() {
  for (const k of ['jump', 'trick', 'duck']) {
    const b = BTN[k], active = k === 'duck' && input.down;
    ctx.fillStyle = active ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.14)';
    rr(b.x, b.y, b.w, b.h, 22); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3; rr(b.x, b.y, b.w, b.h, 22); ctx.stroke();
    text(b.label, b.x + b.w / 2, b.y + b.h / 2, 24, 'rgba(255,255,255,0.9)', 'center', 4, 'rgba(0,0,0,0.5)');
  }
  const b = BTN.pause;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(b.x, b.y, b.w, b.h, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(b.x + 16, b.y + 10, 5, 20); ctx.fillRect(b.x + 27, b.y + 10, 5, 20);
}

function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,12,25,0.82)'; rr(x, y, w, h, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; rr(x, y, w, h, 20); ctx.stroke();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
  const bob = Math.sin(G.t * 3) * 5;
  text('SKATE', W / 2, 52 + bob, 56, '#ffffff', 'center', 10);
  text('UCIECZKA', W / 2, 106 + bob, 56, '#ffd23b', 'center', 10);
  text('Uciekaj przed psem i zbieraj butelki Pepsi!', W / 2, 152, 19, '#fff', 'center', 5);
  panel(W / 2 - 300, 172, 600, 140);
  const L = W / 2 - 270;
  const rows = touchMode || ('ontouchstart' in window)
    ? [['SKOK', 'dotknij ekranu (2× = podwójny skok)'], ['TRIK', 'przycisk w powietrzu = kickflip, punkty i combo'], ['KUCNIJ', 'przytrzymaj – przejedziesz pod dronem'], ['', '10 butelek = SUPER SKILL + dodatkowe życie!']]
    : [['SPACJA / ↑', 'skok (2× = podwójny skok)'], ['X / →', 'trik w powietrzu (kickflip, combo)'], ['↓ / S', 'kucnij – przejedź pod dronem'], ['P / M', 'pauza / wycisz'], ['', '10 butelek = SUPER SKILL + dodatkowe życie!']];
  rows.forEach((r, i) => {
    const y = 192 + i * (rows.length > 4 ? 25 : 31);
    if (r[0]) { text(r[0], L, y, 16, '#ffd23b', 'left', 3); text(r[1], L + 150, y, 16, '#fff', 'left', 3); }
    else text(r[1], W / 2, y, 17, '#7df9ff', 'center', 3);
  });
  if (Math.floor(G.t * 2) % 2 === 0) text(touchMode || ('ontouchstart' in window) ? 'DOTKNIJ, ABY GRAĆ' : 'NACIŚNIJ SPACJĘ, ABY GRAĆ', W / 2, 492, 28, '#fff', 'center', 6);
  if (best) text('REKORD: ' + best, W / 2, 526, 16, '#ffd23b', 'center', 4);
}

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 260, 70, 520, 340);
  text('PIES CIĘ DOGONIŁ!', W / 2, 120, 40, '#ff4d6d', 'center', 7);
  const rows = [['WYNIK', score()], ['DYSTANS', Math.floor(G.dist / 20) + ' m'], ['BUTELKI PEPSI', G.bottles], ['REKORD', best]];
  rows.forEach((r, i) => {
    text(r[0], W / 2 - 200, 180 + i * 42, 20, '#9fe3ff', 'left', 4);
    text(String(r[1]), W / 2 + 200, 180 + i * 42, 26, '#fff', 'right', 5);
  });
  if (G.newBest) text('★ NOWY REKORD! ★', W / 2, 352, 24, '#ffd23b', 'center', 5);
  if (G.overT > 0.8 && Math.floor(G.overT * 2) % 2 === 0)
    text(touchMode ? 'DOTKNIJ, ABY ZAGRAĆ PONOWNIE' : 'SPACJA – ZAGRAJ PONOWNIE', W / 2, 390, 20, '#fff', 'center', 4);
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * 22, rand(-1, 1) * G.shake * 22);
  drawBackground();
  for (const o of G.obstacles) if (o.type === 'hole') drawObstacle(o);
  for (const o of G.obstacles) if (o.type !== 'hole') drawObstacle(o);
  for (const b of G.bottlesArr) drawBottle(b.x, b.y, b.ph);
  drawDog(G.dog);
  drawBoy(G.player);
  for (const q of G.particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.col;
    if (q.star) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.life * 8); ctx.fillRect(-q.size, -1, q.size * 2, 2); ctx.fillRect(-1, -q.size, 2, q.size * 2); ctx.restore(); }
    else { circle(q.x, q.y, q.size); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const t of G.texts) { ctx.globalAlpha = clamp(t.life * 1.5, 0, 1); text(t.txt, t.x, t.y, t.size, t.col, 'center', 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // zagrożenie – pies blisko
  if (state === 'play' && G.dog.gap < 140) {
    const a = (1 - G.dog.gap / 140) * (0.35 + 0.15 * Math.sin(G.t * 10));
    const vg = ctx.createLinearGradient(0, 0, 220, 0);
    vg.addColorStop(0, `rgba(255,0,0,${a})`); vg.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, 220, H);
  }
  // zwolniony czas – fioletowy filtr
  if (G.skill && G.skill.id === 'slowmo') { ctx.fillStyle = 'rgba(150,80,255,0.12)'; ctx.fillRect(0, 0, W, H); }
  // turbo – linie prędkości
  if (G.skill && G.skill.id === 'turbo') {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) { const y = hash(i + Math.floor(G.t * 20)) * H, x = hash(i * 7 + Math.floor(G.t * 20)) * W; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 120, y); ctx.stroke(); }
  }

  if (state !== 'menu') drawHUD();

  if (G.banner && state === 'play') {
    const b = G.banner, k = b.t / b.dur;
    const sc = k < 0.15 ? 0.5 + (k / 0.15) * 0.6 : k < 0.25 ? 1.1 - (k - 0.15) : 1;
    ctx.save(); ctx.globalAlpha = k > 0.8 ? (1 - k) / 0.2 : 1;
    ctx.translate(W / 2, 190); ctx.scale(sc, sc);
    text(b.txt, 0, 0, 54, b.col, 'center', 10);
    text(b.sub, 0, 48, 20, '#fff', 'center', 5);
    ctx.restore();
  }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 0.6; ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (touchMode && state === 'play') drawButtons();
  if (state === 'menu') drawMenu();
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('PAUZA', W / 2, H / 2 - 20, 60, '#fff', 'center', 8);
    text(touchMode ? 'dotknij, aby grać dalej' : 'P – graj dalej', W / 2, H / 2 + 40, 22, '#ffd23b', 'center', 4);
  }
  if (state === 'over') drawOver();
}

/* ======================= PĘTLA ======================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); Snd.updateMusic(!!G.skill); }
  else if (state === 'caught') updateCaught(dt);
  else if (state === 'menu') updateMenu(dt);
  else if (state === 'over') { G.overT += dt; G.t += dt; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
